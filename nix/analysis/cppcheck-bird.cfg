<?xml version="1.0"?>
<!--
  cppcheck library config for BIRD. cppcheck does not predefine compiler
  builtins; without these, lib/birdlib.h and sysdep/config.h take their
  non-GCC branches and TUs parse differently from the real build.
-->
<def format="2">
  <define name="__has_attribute(x)" value="0"/>
  <define name="__has_builtin(x)" value="0"/>
  <define name="__has_feature(x)" value="0"/>
  <define name="__has_include(x)" value="0"/>
  <define name="__GNUC__" value="13"/>
  <define name="__GNUC_MINOR__" value="0"/>
  <define name="__STDC_VERSION__" value="201112L"/>
  <define name="__linux__" value="1"/>
  <define name="__CHAR_BIT__" value="8"/>
  <define name="__SIZEOF_LONG__" value="8"/>
  <define name="__SIZEOF_POINTER__" value="8"/>
  <define name="__ORDER_LITTLE_ENDIAN__" value="1234"/>
  <define name="__ORDER_BIG_ENDIAN__" value="4321"/>
  <define name="__BYTE_ORDER__" value="1234"/>
</def>
